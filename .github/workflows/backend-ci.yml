name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  # Lets you manually trigger a build+test run from the Actions tab (Run workflow),
  # without needing a push/PR.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # `verify`, not `test`: the *IT.java integration tests (real MySQL via Testcontainers, incl. the
      # Flyway migrations) are bound to maven-failsafe in the verify phase, so `test` silently skipped
      # them. ubuntu-latest runners ship with Docker, which is all Testcontainers needs.
      - name: Build, unit tests and integration tests (all modules)
        working-directory: backend
        run: mvn -B -ntp verify

      # So a red build shows WHICH test failed without digging through the raw log.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          retention-days: 7
