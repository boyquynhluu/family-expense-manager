name: Deploy to VPS

# Runs on the self-hosted runner installed on the VPS (label fem-vps): the VPS is IPv6-only and GitHub-hosted
# runners have no IPv6, so they cannot SSH in — the runner on the VPS pulls jobs from GitHub instead.
on:
  # After a CI run on main finishes (deploy only if it passed — see the job's `if`).
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types: [completed]
    branches: [main]
  # Manual redeploy from the Actions tab.
  workflow_dispatch:

# Backend and frontend CI can finish close together — queue deploys, never run two at once.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, fem-vps]
    timeout-minutes: 30
    steps:
      # Pull before running the script, so the VPS always runs the deploy.sh from this commit (even the first time).
      - name: Update code on the VPS
        working-directory: /opt/family-expense-manager
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Deploy
        run: /opt/family-expense-manager/infra/deploy.sh
