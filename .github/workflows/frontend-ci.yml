name: Frontend CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # Lets you manually trigger a lint+build run from the Actions tab (Run workflow).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: Sonar uses git blame to tell new code from old.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Only checks the production build compiles — the real build (with VITE_API_BASE_URL=https://<domain>/api)
      # happens in frontend/Dockerfile on the VPS, see .github/workflows/deploy.yml.
      - name: Build
        working-directory: frontend
        run: npm run build

      # Project keys in frontend/sonar-project.properties. PRs and main only — the free SonarQube Cloud plan
      # does not analyse other branches (see backend-ci.yml).
      - name: SonarQube Cloud scan
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
