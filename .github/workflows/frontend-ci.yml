name: Frontend CI & Deploy

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # Lets you manually redeploy from the Actions tab (Run workflow) without a code
  # change — needed whenever the Cloudflare quick-tunnel URL changes and you just
  # updated the VITE_API_BASE_URL repo variable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Points the deployed site at a real backend once you have one publicly reachable:
      # set the VITE_API_BASE_URL repo variable (Settings -> Secrets and variables -> Actions
      # -> Variables). Until then it falls back to localhost, so the deployed page will load
      # but API calls will fail — that's expected while the backend is local-only.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8080/api' }}
          # This is the only build that needs a base path — GitHub Pages serves it as a
          # project page at /family-expense-manager/. Every other build (Docker/nginx,
          # a local `npm run build`) defaults to "/" (see frontend/vite.config.js).
          VITE_BASE_PATH: /family-expense-manager/
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
