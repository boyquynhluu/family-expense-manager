server:
  port: 8080

spring:
  application:
    name: api-gateway
  # Spring Cloud Gateway Server MVC (servlet-based, not WebFlux) does not support
  # routes-as-YAML — routes are defined as RouterFunction beans in
  # com.family.expensemanager.gateway.config.GatewayRoutesConfig.
  cloud:
    gateway:
      mvc:
        # Without these a hung downstream service held the gateway thread forever. read-timeout must cover the
        # slowest legitimate call (Excel import/export) and stay below the circuit breaker's time limiter
        # (CircuitBreakerConfiguration) and nginx's proxy_read_timeout (120s).
        http-client:
          connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2s}
          read-timeout: ${GATEWAY_READ_TIMEOUT:60s}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-.env}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: expense-service
        url: /api/expenses/v3/api-docs
      - name: notification-service
        url: /api/notifications/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    # Histogram buckets for http_server_requests_seconds, so Grafana can compute p50/p95/p99 response times
    # (infra/grafana/.../fem-overview.json) — without them only the average and max exist. The range caps the
    # bucket count; the SLO buckets give exact "slower than 300ms / 1s" ratios.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
      slo:
        http.server.requests: 300ms,1s
