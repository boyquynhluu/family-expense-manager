server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fem_notify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${FEM_NOTIFY_DB_USER:fem_notify}
    password: ${FEM_NOTIFY_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.family.expensemanager.*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-.env}

kafka:
  topic:
    expense-events: expense-events

management:
  endpoints:
    web:
      exposure:
        include: health
