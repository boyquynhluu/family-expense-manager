server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fem_notify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${FEM_NOTIFY_DB_USER:fem_notify}
    password: ${FEM_NOTIFY_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.family.expensemanager.*"
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-.env}

kafka:
  topic:
    expense-events: expense-events
    user-verification: user-verification
    password-reset: password-reset
    family-invite: family-invite

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@family-expense-manager.local}
    # Display-only, for the "expires in N hours" line in the email — keep in sync with
    # auth-service's auth.verification-token-ttl-hours, which is what actually enforces it.
    verification-ttl-hours: 24
    # Keep in sync with auth-service's auth.reset-password-token-ttl-hours.
    reset-password-ttl-hours: 1
    # Keep in sync with auth-service's auth.invite-token-ttl-hours.
    invite-ttl-hours: 72

management:
  endpoints:
    web:
      exposure:
        include: health
