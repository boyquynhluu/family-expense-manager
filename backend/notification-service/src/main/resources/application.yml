server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fem_notify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${FEM_NOTIFY_DB_USER:fem_notify}
    password: ${FEM_NOTIFY_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.family.expensemanager.*"
        # ~30 consumers (6 topics + their @RetryableTopic retry/DLT topics) each sent an empty fetch to Kafka every
        # 500ms (the default) — constant CPU on both sides while idle. The broker still answers as soon as a record
        # arrives (fetch.min.bytes=1), so this does not delay delivery; it only makes idle fetches rarer.
        fetch.max.wait.ms: 5000
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # JavaMail waits forever by default — a hung SMTP server would block the Kafka listener thread sending
          # the email (and every notification queued behind it). Milliseconds. A timeout fails the send, so the
          # event goes through the listeners' @RetryableTopic retries instead of hanging.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

# Resilience for the two remote calls of the notification path (states/rates exported to Prometheus as
# resilience4j_circuitbreaker_* / resilience4j_retry_*, shown on the Grafana overview dashboard).
resilience4j:
  circuitbreaker:
    instances:
      # FamilyMemberDirectory → auth-service /internal/**. Only network errors and 5xx count: a 4xx is a
      # bug/config problem a pause would not fix. Open = straight to the empty-list fallback for 30s.
      auth-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      # ResilientMailSenderPostProcessor → SMTP. Every send failure counts except a rejected recipient
      # (SmtpFailurePredicate). Open = sends fail at once for 60s instead of each waiting for the SMTP timeouts.
      smtp:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        record-failure-predicate: com.family.expensemanager.notification.config.SmtpFailurePredicate
  retry:
    instances:
      # One retry after a short pause for a transient blip. Not for an open breaker (CallNotPermittedException is
      # not listed), so a down auth-service is not hammered.
      auth-service:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-.env}

kafka:
  topic:
    expense-events: expense-events
    user-verification: user-verification
    password-reset: password-reset
    family-invite: family-invite
    family-member-events: family-member-events
    user-registered: user-registered

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  # Direct (non-gateway) URL of auth-service, for /internal/** calls that must never go through the public gateway.
  auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8081}
  mail:
    from: ${MAIL_FROM:no-reply@family-expense-manager.local}
    # Display-only, for the "expires in N hours" line in the email — keep in sync with
    # auth-service's auth.verification-token-ttl-hours, which is what actually enforces it.
    verification-ttl-hours: 24
    # Keep in sync with auth-service's auth.reset-password-token-ttl-hours.
    reset-password-ttl-hours: 1
    # Keep in sync with auth-service's auth.invite-token-ttl-hours.
    invite-ttl-hours: 72

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    # Histogram buckets for http_server_requests_seconds, so Grafana can compute p50/p95/p99 response times
    # (infra/grafana/.../fem-overview.json) — without them only the average and max exist. The range caps the
    # bucket count; the SLO buckets give exact "slower than 300ms / 1s" ratios.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
      slo:
        http.server.requests: 300ms,1s
