<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cảnh báo vượt ngân sách</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#dc2626;padding:24px 32px;">
                        <span style="color:#ffffff;font-size:20px;font-weight:bold;">Family Expense Manager</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="font-size:16px;color:#1f2933;margin:0 0 16px;">Xin chào <strong>{{displayName}}</strong>,</p>
                        <p style="font-size:14px;color:#3e4c59;line-height:1.6;margin:0 0 24px;">
                            Danh mục <strong>{{categoryName}}</strong> đã vượt ngân sách trong tháng <strong>{{periodMonth}}</strong>.
                        </p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fef2f2;border-radius:6px;margin-bottom:24px;">
                            <tr>
                                <td style="padding:16px 20px;">
                                    <p style="font-size:13px;color:#7b8794;margin:0 0 4px;">Đã chi</p>
                                    <p style="font-size:20px;color:#dc2626;font-weight:bold;margin:0 0 12px;">{{totalSpent}}</p>
                                    <p style="font-size:13px;color:#7b8794;margin:0 0 4px;">Hạn mức</p>
                                    <p style="font-size:16px;color:#1f2933;font-weight:bold;margin:0;">{{limitAmount}}</p>
                                </td>
                            </tr>
                        </table>
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="border-radius:6px;background-color:#2f6feb;">
                                    <a href="{{budgetsLink}}" style="display:inline-block;padding:12px 28px;font-size:14px;color:#ffffff;text-decoration:none;font-weight:bold;">
                                        Xem ngân sách
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <p style="font-size:13px;color:#7b8794;line-height:1.6;margin:24px 0 0;">
                            Bạn có thể điều chỉnh hạn mức hoặc xem chi tiết các khoản chi trong danh mục này trên ứng dụng.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
