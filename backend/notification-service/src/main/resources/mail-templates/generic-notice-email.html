<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#2f6feb;padding:24px 32px;">
                        <span style="color:#ffffff;font-size:20px;font-weight:bold;">Family Expense Manager</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <p style="font-size:16px;color:#1f2933;margin:0 0 16px;">Xin chào <strong>{{recipientName}}</strong>,</p>
                        <p style="font-size:18px;color:#1f2933;font-weight:bold;margin:0 0 12px;">{{title}}</p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
                            <tr>
                                <td style="background-color:#f4f5f7;border-radius:6px;padding:16px 20px;">
                                    <p style="font-size:14px;color:#3e4c59;line-height:1.7;margin:0;">{{message}}</p>
                                </td>
                            </tr>
                        </table>
                        <table role="presentation" cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="background-color:#2f6feb;border-radius:6px;">
                                    <a href="{{link}}" style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:14px;font-weight:bold;text-decoration:none;">Mở ứng dụng</a>
                                </td>
                            </tr>
                        </table>
                        <p style="font-size:12px;color:#9aa5b1;line-height:1.6;margin:24px 0 0;">
                            Bạn có thể tắt loại email này trong mục Thông báo &rarr; Tuỳ chọn của ứng dụng.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
