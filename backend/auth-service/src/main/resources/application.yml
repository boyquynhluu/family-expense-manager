server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fem_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${FEM_AUTH_DB_USER:fem_auth}
    password: ${FEM_AUTH_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-.env}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

auth:
  verification-token-ttl-hours: 24

kafka:
  topic:
    user-verification: user-verification

management:
  endpoints:
    web:
      exposure:
        include: health
