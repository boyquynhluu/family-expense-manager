server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fem_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${FEM_AUTH_DB_USER:fem_auth}
    password: ${FEM_AUTH_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/api/auth/login/oauth2/code/{registrationId}"
          # Facebook tạm bỏ: Spring Boot validate mọi registration khai báo ở đây phải có
          # client-id/secret không rỗng, nên để trống sẽ làm app không start được. Thêm lại
          # khối này (và FACEBOOK_CLIENT_ID/SECRET trong infra/.env) khi có Facebook App thật.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-.env}
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 7

auth:
  verification-token-ttl-hours: 24
  reset-password-token-ttl-hours: 1
  invite-token-ttl-hours: 72
  # Accounts that never verified their email are deleted this many days after their token expired.
  unverified-cleanup:
    retention-days: 7
    cron: "0 30 2 * * *"
  # AES-256 key (base64 of 32 bytes) encrypting TOTP secrets at rest. Required, no default: set
  # TOTP_ENCRYPTION_KEY in infra/.env. To rotate, put the old key in TOTP_ENCRYPTION_KEY_PREVIOUS for one
  # startup (secrets are re-encrypted automatically), then remove it.
  totp-encryption-key: ${TOTP_ENCRYPTION_KEY}
  totp-encryption-key-previous: ${TOTP_ENCRYPTION_KEY_PREVIOUS:}

# Public URL of the api-gateway (not this service) as seen by the browser and by
# Google/Facebook's OAuth2 redirect — must match a redirect URI registered in each
# provider's console, e.g. http://localhost:8080/api/auth/login/oauth2/code/google.
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  oauth2:
    success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:5173/oauth2/callback}

kafka:
  topic:
    user-verification: user-verification
    password-reset: password-reset
    family-invite: family-invite
    family-member-events: family-member-events
    user-registered: user-registered

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
