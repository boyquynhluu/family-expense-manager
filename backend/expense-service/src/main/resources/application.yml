server:
  port: 8082

spring:
  application:
    name: expense-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/fem_expense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${FEM_EXPENSE_DB_USER:fem_expense}
    password: ${FEM_EXPENSE_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-.env}

kafka:
  topic:
    expense-events: expense-events

management:
  endpoints:
    web:
      exposure:
        include: health
