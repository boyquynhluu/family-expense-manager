global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Every service exposes Micrometer metrics at /actuator/prometheus (see each
# service's application.yml — management.endpoints.web.exposure.include). Scraped by
# container name/port on the internal fem-network, same as any other inter-service call.
scrape_configs:
  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: expense-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["expense-service:8082"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8083"]
